name: Deploy controlgrow.ru (Timeweb)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-controlgrow
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_TELEGRAM_BOT_USERNAME: controlgrow_bot
          VITE_SITE_URL: https://controlgrow.ru

      - name: Remember built asset hash
        run: |
          ASSET=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          echo "EXPECTED_ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "Built $ASSET"

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TIMEWEB_FTP_HOST }}
          username: ${{ secrets.TIMEWEB_FTP_USER }}
          password: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.TIMEWEB_FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          log-level: verbose

      - name: Fix remote file permissions (Timeweb nginx 403)
        env:
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_SERVER_DIR: ${{ secrets.TIMEWEB_FTP_SERVER_DIR }}
        run: node scripts/ftp-fix-permissions.mjs

      - name: Verify live site updated
        run: |
          sleep 15
          REMOTE=$(curl -fsSL https://controlgrow.ru/index.html | grep -oE 'assets/index-[^"]+\.js' | head -1)
          echo "Expected: $EXPECTED_ASSET"
          echo "Remote:   $REMOTE"
          if [ "$REMOTE" != "$EXPECTED_ASSET" ]; then
            echo "::error::Production still serves old bundle. Check TIMEWEB_FTP_SERVER_DIR (expected /controlgrow.ru/public_html/)."
            exit 1
          fi
          for path in /auth/ /dashboard/ /admin/; do
            code=$(curl -s -o /tmp/spa-check.html -w "%{http_code}" "https://controlgrow.ru${path}")
            echo "${path} → HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::SPA route ${path} returned ${code} (expected 200). Check auth/index.html permissions."
              exit 1
            fi
            grep -q 'id="root"' /tmp/spa-check.html || {
              echo "::error::SPA route ${path} did not return index.html"
              exit 1
            }
          done
